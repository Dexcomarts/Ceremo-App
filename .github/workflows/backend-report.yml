name: Backend report

'on':
  # Only trusted default-branch code runs; artifacts are bounded data, never scripts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ['Backend checks', 'CodeQL', 'Dependency graph', 'Publish dependency graph', 'Dependency review']
    types: [completed]
  workflow_dispatch:
    inputs:
      runId:
        description: Completed allowlisted quality workflow run to report
        required: true
        type: string
  push:
    paths:
      - '.github/workflows/backend-report.yml'
      - 'scripts/ci_report.py'
      - 'scripts/team_report.py'
      - 'scripts/test_team_report.py'
      - 'scripts/test_ci_report.py'
      - 'scripts/sonar_test_report.py'
      - 'scripts/test_sonar_test_report.py'
      - 'scripts/dependency_snapshot.py'
      - 'scripts/security_report.py'
      - 'scripts/ci_tools.py'
      - 'scripts/test_dependency_snapshot.py'
      - 'scripts/test_security_report.py'
      - 'scripts/test_ci_tools.py'

permissions: {}

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out reporting code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify reporting and publication safeguards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  resolve:
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      pullRequest: ${{ steps.target.outputs.pullRequest }}
    steps:
      - name: Check out trusted PR resolver
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve current PR for concurrency
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_RUN_ID: ${{ inputs.runId || github.event.workflow_run.id }}
        run: python3 scripts/ci_report.py resolve --run-id "$REPORT_RUN_ID"

  comment:
    needs: resolve
    if: needs.resolve.outputs.pullRequest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ceremo-pr-report-${{ needs.resolve.outputs.pullRequest }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      # workflow_sha is the reporter's trusted revision, never the tested PR's head.
      - name: Check out trusted reporter
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Update current PR report
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_RUN_ID: ${{ inputs.runId || github.event.workflow_run.id }}
        run: python3 scripts/ci_report.py publish --run-id "$REPORT_RUN_ID"
