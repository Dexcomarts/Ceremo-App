name: Dependency graph

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  graph:
    name: Resolve Gradle dependencies
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SNAPSHOT_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: ceremo-gradle
    steps:
      - name: Check out snapshot revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Resolve verified dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        env:
          GITHUB_DEPENDENCY_GRAPH_REF: ${{ env.SNAPSHOT_REF }}
          GITHUB_DEPENDENCY_GRAPH_SHA: ${{ env.SNAPSHOT_SHA }}
        with:
          dependency-graph: generate-and-upload
          dependency-graph-report-dir: build/reports/dependencies/raw
          dependency-graph-continue-on-failure: false
          artifact-retention-days: 7
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          additional-arguments: --no-daemon --dependency-verification=strict -Ddependency-graph-plugin.version=1.5.0
      - name: Validate complete snapshot
        run: python3 scripts/dependency_snapshot.py prepare
      - name: Upload dependency graph
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ceremo-dependencies-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/reports/dependencies/snapshot.json
          retention-days: 7
          if-no-files-found: error
