name: Backend checks

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: ceremo-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: src/docker/sonar.yml:src/docker/sonar-ci.yml
      CEREMO_SONAR_CI_PORT: '19001'
      SONAR_HOST_URL: http://127.0.0.1:19001
    steps:
      - name: Check out application
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare Linux limits and start isolated SonarQube
        run: |
          sudo sysctl -w vm.max_map_count=524288
          sudo sysctl -w fs.file-max=131072
          docker compose build sonar-token
          docker compose run --rm --no-deps -T \
            --volume "$GITHUB_WORKSPACE/scripts/test-sonar-bootstrap.sh:/tmp/test-sonar-bootstrap.sh:ro" \
            --entrypoint /bin/bash sonar-token /tmp/test-sonar-bootstrap.sh
          docker compose up --detach --wait --wait-timeout 600 sonar
      - name: Bootstrap project and temporary analysis token
        id: bootstrap
        run: docker compose run --rm --no-deps -T sonar-token
      - name: Verify tests, PostgreSQL integration, coverage and Sonar gate
        id: checks
        run: |
          SONAR_TOKEN="$(docker compose run --rm --no-deps -T --entrypoint /bin/cat sonar-token /tokens/sonar-token)"
          test -n "$SONAR_TOKEN"
          echo "::add-mask::$SONAR_TOKEN"
          export SONAR_TOKEN
          # Each run scans its own whole-code project, including PRs. No PR decoration.
          # Prevent the scanner from requesting unsupported Community PR analysis.
          env -u GITHUB_ACTION -u GITHUB_ACTIONS bash ./gradlew --no-daemon check bootJar sonar
      - name: Record and verify evaluated overall-code gate
        if: always() && steps.bootstrap.outcome == 'success'
        run: |
          mkdir -p build/reports/sonar
          docker compose run --rm --no-deps -T sonar-token report > build/reports/sonar/quality-gate.json
      - name: Remove temporary containers and credential volumes
        if: always()
        run: |
          docker compose --profile tools down --volumes --remove-orphans --timeout 20
          test -z "$(docker ps --all --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          test -z "$(docker volume ls --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
      - name: Save coverage and gate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-quality-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
          path: |
            build/reports/jacoco/combined/combined.xml
            build/reports/jacoco/combined/html/
            build/reports/sonar/quality-gate.json
