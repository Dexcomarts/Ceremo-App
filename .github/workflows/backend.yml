name: Backend checks

'on':
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runSonar:
        description: Run analysis against the approved SonarQube server
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out application
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify tests, PostgreSQL integration and coverage
        run: bash ./gradlew --no-daemon check bootJar

  sonar:
    if: github.event_name == 'workflow_dispatch' && inputs.runSonar
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out application
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify and wait for the SonarQube quality gate
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "Configure the approved SONAR_HOST_URL variable and SONAR_TOKEN secret."
            exit 1
          fi
          bash ./gradlew --no-daemon sonar
