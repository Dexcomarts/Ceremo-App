# Use only with sonar.yml and a unique CI Compose project; requires Compose >= 2.24.4.
services:
  sonar:
    environment:
      SONAR_FORCEAUTHENTICATION: 'true'
    ports: !override
      - '127.0.0.1:${CEREMO_SONAR_CI_PORT:-19001}:9000'
    mem_limit: 3g
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:9000/api/system/status | grep -q ''"status":"UP"''']
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s
  sonar-token:
    environment:
      CEREMO_SONAR_CI_BOOTSTRAP: 'true'
      CEREMO_SONAR_PASSWORD: ''
      CEREMO_SONAR_USERNAME: admin
      CEREMO_SONAR_TOKEN_NAME: ceremo-ci
    depends_on:
      sonar:
        condition: service_healthy
