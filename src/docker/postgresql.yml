# Local development only. Trust authentication is not a production setting.
services:
  postgresql:
    image: postgres:18.0
    environment:
      POSTGRES_USER: ceremo
      POSTGRES_DB: ceremo
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ceremo -d ceremo']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgresql_data:
