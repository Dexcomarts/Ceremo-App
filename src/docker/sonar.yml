# Local SonarQube evaluation only; its embedded database is not a production database.
services:
  sonar:
    image: sonarqube:25.12.0.117093-community
    environment:
      # Local dashboard browsing; administration and analysis still require credentials.
      SONAR_FORCEAUTHENTICATION: 'false'
    ports:
      - '127.0.0.1:9001:9000'
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
  sonar-token:
    profiles: ['tools']
    build:
      context: .
      dockerfile: sonar/Dockerfile
    environment:
      CEREMO_SONAR_URL: http://sonar:9000
      CEREMO_SONAR_USERNAME: ${CEREMO_SONAR_USERNAME:-admin}
      CEREMO_SONAR_PASSWORD: ${CEREMO_SONAR_PASSWORD:-}
      CEREMO_SONAR_TOKEN_NAME: ${CEREMO_SONAR_TOKEN_NAME:-ceremo-local}
      CEREMO_SONAR_TOKEN_FILE: /tokens/sonar-token
    volumes:
      - sonar_tokens:/tokens
    depends_on:
      - sonar
volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  sonar_tokens:
