# Local development only. Production must use start, HTTPS and a production database.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ['start-dev', '--import-realm']
    volumes:
      - ./keycloak-realm-config:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data
    environment:
      KC_DB: dev-file
      KC_BOOTSTRAP_ADMIN_USERNAME: ${CEREMO_KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CEREMO_KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: '9080'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:9080:9080'
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    labels:
      org.springframework.boot.readiness-check.tcp.disable: 'true'
volumes:
  keycloak_data:
