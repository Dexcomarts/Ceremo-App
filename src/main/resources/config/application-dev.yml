logging:
  level:
    io:
      ceremo_app:
        ceremo: DEBUG
application:
  registration:
    terms-version: terms-v1
  security:
    content-security-policy: "default-src 'self'; connect-src 'self' http://localhost:9080; frame-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com;"
